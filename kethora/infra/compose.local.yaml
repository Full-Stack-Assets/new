# Synthetic local development only. Never expose the fixture services to the public network.
services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment: {POSTGRES_DB: kethora_local, POSTGRES_USER: kethora_dev_migration, POSTGRES_PASSWORD: synthetic-local-only}
    volumes: [pgdata:/var/lib/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U kethora_dev_migration -d kethora_local"], interval: 5s, timeout: 3s, retries: 15}
  temporal_volume_init:
    image: docker.io/library/node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    command: ["sh", "-c", "mkdir -p /data/db && chmod 1777 /data/db"]
    volumes: [temporaldata:/data]
  temporal:
    depends_on:
      temporal_volume_init: {condition: service_completed_successfully}
    image: docker.io/temporalio/temporal:1.5.1@sha256:4fc5d9fbaba3b72316a992b14e47d34546909f097fc3d7111aedb27d474c2457
    platform: linux/amd64
    environment:
      NO_PROXY: "localhost,127.0.0.1,0.0.0.0"
      no_proxy: "localhost,127.0.0.1,0.0.0.0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/db/temporal.sqlite"]
    volumes: [temporaldata:/data]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
  object_store:
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["mini"]
    environment: {AWS_ACCESS_KEY_ID: synthetic-local-only, AWS_SECRET_ACCESS_KEY: synthetic-local-key-only, S3_BUCKET: kethora-synthetic}
    volumes: [objectdata:/data]
    ports: ["127.0.0.1:8333:8333"]
  calendar_fixture:
    image: docker.io/library/node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    command: ["node", "/fixture/calendar.mjs"]
    volumes: ["../tests/contract/fixtures/calendar.mjs:/fixture/calendar.mjs:ro"]
    ports: ["127.0.0.1:8790:8790"]
volumes: {pgdata: {}, objectdata: {}, temporaldata: {}}
