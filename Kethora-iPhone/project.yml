name: Kethora
options:
  minimumXcodeGenVersion: 2.46.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    PRODUCT_BUNDLE_IDENTIFIER: com.example.kethora
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Kethora:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources: [Kethora]
    info:
      path: Kethora/Info.plist
      properties:
        CFBundleDisplayName: Kethora
        KETHORA_API_URL: https://api.kethora.invalid/v1/
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
